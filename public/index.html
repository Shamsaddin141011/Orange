<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the page paint under the notch / home indicator instead of white bars -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Colours Safari / Chrome use for the status bar and browser toolbars (match theme bg) -->
    <meta name="theme-color" content="#0F0A04" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFAF5" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OrangeUni</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Page background behind the app, overscroll and browser chrome: theme bg, never white */
      html,
      body {
        background-color: #0F0A04;
      }
      /* iOS Safari zooms the page when a field under 16px is focused and never zooms back,
         leaving the layout cut off on the right. Keep fields at 16px on touch screens. */
      @media (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: #FFFAF5;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
