<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the page paint under the notch / home indicator instead of white bars -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Colours Safari / Chrome use for the status bar and browser toolbars (match theme bg) -->
    <meta name="theme-color" content="#0F0A04" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFAF5" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OrangeUni — Find, compare and track universities</title>
    <!-- Search engines show this instead of the noscript text (the app renders with JavaScript) -->
    <meta name="description" content="OrangeUni helps students find, compare and track universities. Get matched with schools that fit your interests, test scores and budget, shortlist favourites, and follow every application deadline." />
    <link rel="canonical" href="https://www.orangeuni.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OrangeUni" />
    <meta property="og:title" content="OrangeUni — Find, compare and track universities" />
    <meta property="og:description" content="OrangeUni helps students find, compare and track universities. Get matched with schools that fit your interests, test scores and budget, shortlist favourites, and follow every application deadline." />
    <meta property="og:url" content="https://www.orangeuni.org/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="OrangeUni — Find, compare and track universities" />
    <meta name="twitter:description" content="OrangeUni helps students find, compare and track universities. Get matched with schools that fit your interests, test scores and budget, shortlist favourites, and follow every application deadline." />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Structured data: tells Google the brand name, site and logo (helps the "OrangeUni" brand query) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.orangeuni.org/#organization",
          "name": "OrangeUni",
          "url": "https://www.orangeuni.org/",
          "logo": "https://www.orangeuni.org/icon-512.png",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://www.orangeuni.org/#website",
          "name": "OrangeUni",
          "url": "https://www.orangeuni.org/",
          "publisher": { "@id": "https://www.orangeuni.org/#organization" }
        }
      ]
    }
    </script>
    <!-- sameAs: add official social profile URLs (Instagram, X, LinkedIn, ...) to the Organization above when they exist -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Page background behind the app, overscroll and browser chrome: theme bg, never white */
      html,
      body {
        background-color: #0F0A04;
      }
      /* iOS Safari zooms the page when a field under 16px is focused and never zooms back,
         leaving the layout cut off on the right. Keep fields at 16px on touch screens. */
      @media (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: #FFFAF5;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <main style="max-width: 640px; margin: 48px auto; padding: 0 16px; font-family: system-ui, sans-serif; color: #FFFAF5;">
        <h1>OrangeUni</h1>
        <p>OrangeUni helps students find, compare and track universities. Get matched with schools that fit your interests, test scores and budget, shortlist favourites, and follow every application deadline.</p>
        <p>Turn on JavaScript to use the app, <a href="/universities" style="color: #FF6B1A;">browse all universities</a>, or read <a href="/about" style="color: #FF6B1A;">about OrangeUni</a>, our <a href="/privacy" style="color: #FF6B1A;">privacy policy</a> and <a href="/terms" style="color: #FF6B1A;">terms</a>.</p>
      </main>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
